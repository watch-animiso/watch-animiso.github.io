<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

/* HERO BACKGROUND */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://images.alphacoders.com/135/1351950.jpeg") no-repeat center center/cover;
    filter: brightness(0.4);
    z-index: -1;
    animation: zoom 20s infinite alternate ease-in-out;
}

@keyframes zoom {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* CONTENT */
.container {
    text-align: center;
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    background: rgba(0,0,0,0.4);
    animation: fadeIn 2s ease;
}

h1 {
    font-size: 3rem;
    letter-spacing: 2px;
    margin-bottom: 10px;
    animation: glow 2s infinite alternate;
}

p {
    opacity: 0.85;
    margin-bottom: 20px;
}

/* COUNTDOWN */
.countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.time-box {
    background: rgba(255,255,255,0.1);
    padding: 15px 20px;
    border-radius: 10px;
    min-width: 70px;
}

.time-box h2 {
    font-size: 2rem;
}

.time-box span {
    font-size: 0.8rem;
    opacity: 0.7;
}

/* LOADER */
.loader {
    margin: 25px auto 10px;
    width: 50px;
    height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top: 5px solid #ffcc00;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

/* ANIMATIONS */
@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes glow {
    from { text-shadow: 0 0 10px #ffcc00; }
    to { text-shadow: 0 0 30px #ffcc00, 0 0 50px #ffcc00; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.9rem;
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
    <h1>🏴‍☠️ Under Construction</h1>
    <p>We're building something legendary...</p>

    <div class="countdown">
        <div class="time-box">
            <h2 id="hours">24</h2>
            <span>Hours</span>
        </div>
        <div class="time-box">
            <h2 id="minutes">00</h2>
            <span>Minutes</span>
        </div>
        <div class="time-box">
            <h2 id="seconds">00</h2>
            <span>Seconds</span>
        </div>
    </div>

    <div class="loader"></div>
</div>

<footer style="color:#000">© 2026 AnimiSo</footer>

<script>

if ( document.location.href.startsWith('http://') ) {
    document.location.href = 'https://' + document.location.href.split('/')[2];
}
    
let countdownTime = 24 * 60 * 60;

const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

function updateCountdown() {
    let hours = Math.floor(countdownTime / 3600);
    let minutes = Math.floor((countdownTime % 3600) / 60);
    let seconds = countdownTime % 60;

    hoursEl.innerText = String(hours).padStart(2, '0');
    minutesEl.innerText = String(minutes).padStart(2, '0');
    secondsEl.innerText = String(seconds).padStart(2, '0');

    if (countdownTime > 0) {
        countdownTime--;
    }
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
